name: Korean gameplay database audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'source/dat/database/**'
      - 'tools/dcss-extractor/scripts/audit_database_translations.py'
      - 'tools/dcss-extractor/scripts/test_audit_database_translations.py'
      - 'tools/dcss-extractor/scripts/audit_monspell_ko.py'
      - 'tools/dcss-extractor/scripts/test_audit_monspell_ko.py'
      - '.github/workflows/database-translation-audit.yml'
  push:
    branches: [main]
    paths:
      - 'source/dat/database/**'
      - 'tools/dcss-extractor/scripts/audit_database_translations.py'
      - 'tools/dcss-extractor/scripts/test_audit_database_translations.py'
      - 'tools/dcss-extractor/scripts/audit_monspell_ko.py'
      - 'tools/dcss-extractor/scripts/test_audit_monspell_ko.py'
      - '.github/workflows/database-translation-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test database parser and comparison
        run: python -m unittest discover -s tools/dcss-extractor/scripts -p 'test_audit_database_translations.py' -v
      - name: Audit all gameplay text database files
        run: |
          python tools/dcss-extractor/scripts/audit_database_translations.py --source source --output tools/dcss-extractor/output/DB-AUDIT-001
      - name: Test monster speech grammar and markup validation
        run: python -m unittest discover -s tools/dcss-extractor/scripts -p 'test_audit_monspell_ko.py' -v
      - name: Audit Korean monster spell overlays against original keys
        run: |
          python tools/dcss-extractor/scripts/audit_monspell_ko.py \
            --original source/dat/database/monspell.txt \
            --localized source/dat/database/ko/monspell.txt \
            --output tools/dcss-extractor/output/DB-AUDIT-001/monspell_ko.json
      - name: Publish detailed database audit reports
        uses: actions/upload-artifact@v4
        with:
          name: database-translation-audit
          path: tools/dcss-extractor/output/DB-AUDIT-001/
          if-no-files-found: error
