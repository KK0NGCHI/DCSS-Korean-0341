name: C++ Korean build verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'source/**/*.cc'
      - 'source/**/*.h'
      - '.github/workflows/cpp-build-verification.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install console build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config bison flex python3-yaml \
            libncurses-dev libsqlite3-dev zlib1g-dev liblua5.1-0-dev \
            libpcre3-dev libzstd-dev
      - name: Compile DCSS console binary
        working-directory: source
        run: make -j2
      - name: Verify executable
        run: |
          test -x source/crawl
          file source/crawl
