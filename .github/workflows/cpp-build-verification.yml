name: C++ Korean build verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'source/**/*.cc'
      - 'source/**/*.h'
      - '.github/workflows/cpp-build-verification.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install console build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config bison flex python3-yaml \
            libncurses-dev libsqlite3-dev zlib1g-dev liblua5.1-0-dev \
            libpcre3-dev libzstd-dev
      - name: Fetch official 0.34.1 full source release
        run: |
          curl --fail --location --retry 3 --output /tmp/stone_soup-0.34.1.tar.xz \
            https://github.com/crawl/crawl/releases/download/0.34.1/stone_soup-0.34.1.tar.xz
          echo '473b9cdc16be0b537ac11e43c6c77db4b290000e4a17f72a842eba59c6b7be2a  /tmp/stone_soup-0.34.1.tar.xz' | sha256sum -c -
          mkdir -p /tmp/crawl-build
          tar -xJf /tmp/stone_soup-0.34.1.tar.xz -C /tmp/crawl-build
          find /tmp/crawl-build -maxdepth 3 -name Makefile.obj -print
      - name: Overlay translated C++ sources
        run: |
          upstream=$(find /tmp/crawl-build -maxdepth 3 -name Makefile.obj -printf '%h\n' | head -n 1)
          test -n "$upstream"
          for name in ability.cc beam.cc describe.cc god-abil.cc invent.cc message.cc player-equip.cc player.cc spl-summoning.cc newgame.cc; do
            cp "source/$name" "$upstream/$name"
          done
          printf '%s\n' "$upstream" > /tmp/dcss-build-source-path
      - name: Compile translated DCSS console binary
        run: |
          cd "$(cat /tmp/dcss-build-source-path)"
          make -j2
      - name: Verify executable
        run: |
          cd "$(cat /tmp/dcss-build-source-path)"
          test -x crawl
          file crawl
